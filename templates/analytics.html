<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Analytics</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:#F4F7FB;

padding:30px;

}

.container{

max-width:1200px;

margin:auto;

}

h1{

margin-bottom:25px;

color:#1F2937;

}

.summary{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-bottom:35px;

}

.card{

background:#fff;

padding:25px;

border-radius:18px;

box-shadow:0 8px 18px rgba(0,0,0,.08);

}

.card h3{

font-size:16px;

color:#6B7280;

margin-bottom:12px;

}

.card h2{

font-size:32px;

color:#2563EB;

}

.chart-grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(450px,1fr));

gap:25px;

}

.chart-box{

background:#fff;

padding:20px;

border-radius:18px;

box-shadow:0 8px 18px rgba(0,0,0,.08);

}

.chart-box h2{

margin-bottom:20px;

font-size:18px;

color:#111827;

}

.back-btn{

display:inline-block;

margin-top:35px;

background:#2563EB;

padding:12px 25px;

color:#fff;

text-decoration:none;

border-radius:12px;

font-weight:600;

transition:.3s;

}

.back-btn:hover{

background:#1D4ED8;

}

</style>

</head>

<body>

<div class="container">

<h1>📊 Monthly Analytics</h1>

<div class="summary">

<div class="card">

<h3>Total Income</h3>

<h2>₹{{ income }}</h2>

</div>

<div class="card">

<h3>Total Expense</h3>

<h2>₹{{ expense }}</h2>

</div>

<div class="card">

<h3>Total Savings</h3>

<h2>₹{{ savings }}</h2>

</div>

</div>

<div class="chart-grid">

<div class="chart-box">

<h2>Income vs Expense</h2>

<canvas id="barChart"></canvas>

</div>

<div class="chart-box">

<h2>Expense Categories</h2>

<canvas id="pieChart"></canvas>

</div>

<div class="chart-box">

<h2>Monthly Trend</h2>

<canvas id="lineChart"></canvas>

</div>
</div>

<a
href="{{ url_for('dashboard') }}"
class="back-btn">

⬅ Back to Dashboard

</a>

</div>

<script>

const months = {{ monthly_data.keys()|list|tojson }};

const incomeData = [
{% for m, v in monthly_data.items() %}
{{ v.income }},
{% endfor %}
];

const expenseData = [
{% for m, v in monthly_data.items() %}
{{ v.expense }},
{% endfor %}
];
const categories=[
{% for c in category_data %}
"{{ c }}",
{% endfor %}
];

const categoryValues=[
{% for c,v in category_data.items() %}
{{ v }},
{% endfor %}
];

new Chart(

document.getElementById("barChart"),

{

type:"bar",

data:{

labels:["Income","Expense"],

datasets:[{

data:[
{{ income }},
{{ expense }}
],

backgroundColor:[
"#10B981",
"#EF4444"
]

}]

}

});
new Chart(

document.getElementById("pieChart"),

{

type:"pie",

data:{

labels:categories,

datasets:[{

data:categoryValues,

backgroundColor:[

"#2563EB",
"#10B981",
"#F59E0B",
"#EF4444",
"#8B5CF6",
"#06B6D4",
"#F97316",
"#84CC16",
"#EC4899"

]

}]

}

});
new Chart(

document.getElementById("lineChart"),

{

type:"line",

data:{

labels:months,

datasets:[

{

label:"Income",

data:incomeData,

borderColor:"#10B981",

backgroundColor:"rgba(16,185,129,.15)",

fill:true,

tension:.45,

pointRadius:0,

pointHoverRadius:6,

borderWidth:3

},

{

label:"Expense",

data:expenseData,

borderColor:"#EF4444",

backgroundColor:"rgba(239,68,68,.15)",

fill:true,

tension:.45,

pointRadius:0,

pointHoverRadius:6,

borderWidth:3

}

]

},

options:{

responsive:true,

plugins:{
legend:{
position:"top"
}
},

elements:{
line:{
borderJoinStyle:"round"
}
},

scales:{

y:{
beginAtZero:true,
grid:{
color:"#E5E7EB"
}
},

x:{
grid:{
display:false
}
}

}

}

});
</script>

</body>

</html>
