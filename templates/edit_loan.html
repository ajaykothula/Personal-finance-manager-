<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Loan</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Poppins,sans-serif;
        }

        body{
            background:#f4f7fb;
            padding:40px;
        }

        .container{
            max-width:600px;
            margin:auto;
            background:#fff;
            padding:30px;
            border-radius:15px;
            box-shadow:0 8px 20px rgba(0,0,0,.08);
        }

        h2{
            margin-bottom:20px;
            color:#1f2937;
        }

        label{
            display:block;
            margin-top:15px;
            font-weight:600;
        }

        input,
        select{
            width:100%;
            padding:12px;
            margin-top:6px;
            border:1px solid #ddd;
            border-radius:8px;
        }

        button{
            margin-top:25px;
            width:100%;
            padding:14px;
            border:none;
            border-radius:10px;
            background:#2563EB;
            color:#fff;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }

        .back{
            display:inline-block;
            margin-top:20px;
            text-decoration:none;
            color:#2563EB;
        }
    </style>
</head>
<body>

<div class="container">

<h2>✏️ Edit Loan</h2>

<form method="POST">

<label>Loan Name</label>
<input type="text" name="loan_name" value="{{ loan.loan_name }}" required>

<label>Loan Type</label>
<input type="text" name="loan_type" value="{{ loan.loan_type }}" required>

<label>Loan Amount</label>
<input type="number" step="0.01" name="loan_amount" value="{{ loan.loan_amount }}" required>

<label>EMI Amount</label>
<input type="number" step="0.01" name="emi_amount" value="{{ loan.emi_amount }}" required>

<label>Outstanding</label>
<input type="number" step="0.01" name="outstanding" value="{{ loan.outstanding }}" required>

<label>Due Date</label>
<input type="date" name="due_date" value="{{ loan.due_date }}" required>

<label>Status</label>
<select name="status">
    <option value="Pending" {% if loan.status=="Pending" %}selected{% endif %}>Pending</option>
    <option value="Paid" {% if loan.status=="Paid" %}selected{% endif %}>Paid</option>
</select>

<button type="submit">💾 Update Loan</button>

</form>

<a href="{{ url_for('loans') }}" class="back">⬅ Back to Loans</a>

</div>

</body>
</html>
