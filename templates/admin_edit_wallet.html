<!DOCTYPE html>
<html>

<head>

<title>Edit Wallet</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/admin.css') }}">

</head>

<body>

<div class="main">

<h1>✏️ Edit Wallet</h1>

<form method="POST">

<label>Wallet Name</label>

<input
type="text"
name="name"
value="{{ wallet.name }}"
required>

<label>Balance</label>

<input
type="number"
step="0.01"
name="balance"
value="{{ wallet.balance }}"
required>

<br><br>

<button type="submit" class="edit-btn">
💾 Save Changes
</button>

<a href="{{ url_for('admin_wallets') }}"
class="view-btn">
⬅ Back
</a>

</form>

</div>

</body>

</html>
