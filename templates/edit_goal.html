<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Edit Savings Goal</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:#F4F7FB;

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

padding:20px;

}

.container{

width:100%;

max-width:500px;

background:#fff;

padding:35px;

border-radius:20px;

box-shadow:0 10px 25px rgba(0,0,0,.08);

}

h1{

text-align:center;

margin-bottom:30px;

color:#1F2937;

}

label{

display:block;

margin-bottom:8px;

font-weight:600;

color:#374151;

}

input{

width:100%;

padding:14px;

margin-bottom:20px;

border:1px solid #D1D5DB;

border-radius:10px;

font-size:15px;

outline:none;

}

input:focus{

border-color:#2563EB;

}

button{

width:100%;

padding:14px;

border:none;

border-radius:10px;

background:#2563EB;

color:white;

font-size:16px;

font-weight:600;

cursor:pointer;

transition:.3s;

margin-bottom:15px;

}

button:hover{

background:#1D4ED8;

}

.back-btn{

display:block;

text-align:center;

text-decoration:none;

background:#6B7280;

color:white;

padding:14px;

border-radius:10px;

font-weight:600;

transition:.3s;

}

.back-btn:hover{

background:#4B5563;

}

</style>

</head>

<body>

<div class="container">

<h1>✏ Edit Savings Goal</h1>

<form method="POST">

<label>Goal Name</label>

<input
type="text"
name="title"
value="{{ goal.title }}"
required>

<label>Target Amount (₹)</label>

<input
type="number"
step="0.01"
name="target_amount"
value="{{ goal.target_amount }}"
required>

<button type="submit">

💾 Update Goal

</button>

</form>

<a
href="{{ url_for('savings_goals') }}"
class="back-btn">

⬅ Back to Savings Goals

</a>

</div>

</body>

</html>
