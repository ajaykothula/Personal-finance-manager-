<!DOCTYPE html>
<html>

<head>
<title>Add Money</title>
<link rel="stylesheet"
href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>

<body>

<div class="container">

<h2>💰 Add Money to {{ goal.title }}</h2>

<p>Target: ₹{{ goal.target_amount }}</p>

<p>Saved: ₹{{ goal.saved_amount }}</p>

<form method="POST">

<label>Amount</label>

<input
type="number"
step="0.01"
name="amount"
required>

<button type="submit">
➕ Add Money
</button>

</form>

</div>

</body>

</html>
