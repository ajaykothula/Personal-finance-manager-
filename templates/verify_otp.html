<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verify OTP</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/verify_otp.css') }}">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>🔐 Verify OTP</h1>

        <p>
            Enter the 6-digit OTP sent to your email.
        </p>

        <form method="POST">

            <input
                type="text"
                name="otp"
                maxlength="6"
                placeholder="Enter OTP"
                required>

            <button type="submit">
                ✅ Verify OTP
            </button>

        </form>

        <br>

        <a href="{{ url_for('resend_otp') }}" class="resend-btn">
            🔄 Resend OTP
        </a>

        <br><br>

        <a href="{{ url_for('login') }}" class="back-btn">
            ← Back to Login
        </a>

    </div>

</div>

</body>
</html>
